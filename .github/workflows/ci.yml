name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vyra
          POSTGRES_PASSWORD: vyra
          POSTGRES_DB: vyra_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Client PostgreSQL 16 (pg_dump / pg_restore pour le test de sauvegarde)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - name: Gel du moteur et empreintes de référence v0.2.0
        run: npx vitest run --project engine
      - name: Tests unitaires, API (PostgreSQL) et traductions
        run: npm test
      - name: Bases des tests navigateur
        run: PGPASSWORD=vyra psql -h 127.0.0.1 -U vyra -d vyra_test -c "CREATE DATABASE vyra_e2e"
      - run: npx playwright install --with-deps chromium
      - name: Tests navigateur (ordinateur, tablette, mobile)
        run: npm run test:e2e
