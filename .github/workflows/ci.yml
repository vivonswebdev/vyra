name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Épinglé : le client PostgreSQL doit avoir la même version majeure que le serveur (16) pour pg_restore.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vyra
          POSTGRES_PASSWORD: vyra
          POSTGRES_DB: vyra_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Client PostgreSQL 16 (pg_dump / pg_restore pour le test de sauvegarde)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: npm ci
      - name: ClamAV (moteur réel, base de signatures de TEST EICAR)
        run: |
          sudo apt-get install -y clamav-daemon
          sudo systemctl stop clamav-daemon clamav-freshclam || true
          node scripts/clamav-test-db.mjs "$RUNNER_TEMP/clamav" 3310
          # Instance de test : copie du binaire (le profil AppArmor d'Ubuntu, lié à /usr/sbin/clamd, ne
          # s'applique pas à cette copie qui lit sa base et sa configuration dans le dossier du runner).
          cp /usr/sbin/clamd "$RUNNER_TEMP/clamd-test"
          "$RUNNER_TEMP/clamd-test" --config-file="$RUNNER_TEMP/clamav/clamd.conf"
          for i in $(seq 1 30); do printf 'zPING\0' | timeout 2 nc -q1 127.0.0.1 3310 | grep -q PONG && break; sleep 1; done
          printf 'zPING\0' | timeout 2 nc -q1 127.0.0.1 3310 | grep -q PONG
      # MinIO ne distribue plus de binaire prêt à l'emploi (dl.min.io répond 410) : compilation de la même
      # révision que celle utilisée pour les essais locaux, mise en cache entre les exécutions.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Cache des serveurs de test compilés
        id: testsrv
        uses: actions/cache@v4
        with:
          path: ~/go/bin/minio
          key: minio-v0.0.0-20260212201848-7aac2a2c5b7c-go1.24
      - name: Compilation de MinIO (révision figée)
        if: steps.testsrv.outputs.cache-hit != 'true'
        run: go install github.com/minio/minio@v0.0.0-20260212201848-7aac2a2c5b7c
      - name: Serveur S3 réel (MinIO) pour les tests de stockage
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER=vyra-ci-admin MINIO_ROOT_PASSWORD=vyra-ci-secret-123 nohup ~/go/bin/minio server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          curl -sf http://127.0.0.1:9000/minio/health/live || { cat "$RUNNER_TEMP/minio.log"; exit 1; }
      - name: Serveur SMTP de test (Mailpit, version figée)
        run: |
          curl -sSfL https://github.com/axllent/mailpit/releases/download/v1.33.1/mailpit-linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" mailpit
          nohup "$RUNNER_TEMP/mailpit" --smtp 127.0.0.1:1025 --listen 127.0.0.1:8025 --smtp-auth-allow-insecure --smtp-auth-accept-any > "$RUNNER_TEMP/mailpit.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8025/api/v1/messages > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8025/api/v1/messages > /dev/null || { cat "$RUNNER_TEMP/mailpit.log"; exit 1; }
      - name: Tests unitaires, API (PostgreSQL), antivirus (ClamAV réel), S3 (MinIO réel), SMTP (Mailpit) et traductions
        run: npm test
        env:
          CLAMD_TEST: "1"
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_ACCESS_KEY: vyra-ci-admin
          S3_TEST_SECRET_KEY: vyra-ci-secret-123
          SMTP_TEST_URL: smtp://127.0.0.1:1025
          MAILPIT_TEST_API: http://127.0.0.1:8025
      - name: Bases des tests navigateur
        run: PGPASSWORD=vyra psql -h 127.0.0.1 -U vyra -d vyra_test -c "CREATE DATABASE vyra_e2e"
      - run: npx playwright install --with-deps chromium
      - name: Tests navigateur (ordinateur, tablette, mobile)
        run: npm run test:e2e
      - name: Archive de version et test de fumée en production (vrais services)
        run: |
          node scripts/release.mjs "$RUNNER_TEMP/release"
          PGPASSWORD=vyra psql -h 127.0.0.1 -U vyra -d vyra_test -c "CREATE DATABASE vyra_smoke"
          node scripts/smoke-release.mjs "$(ls "$RUNNER_TEMP"/release/*.tar.gz)"
        env:
          SMOKE_DATABASE_URL: postgres://vyra:vyra@127.0.0.1:5432/vyra_smoke
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_ACCESS_KEY: vyra-ci-admin
          S3_TEST_SECRET_KEY: vyra-ci-secret-123
          SMTP_TEST_URL: smtp://127.0.0.1:1025
          MAILPIT_TEST_API: http://127.0.0.1:8025
